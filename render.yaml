services:
  - type: web
    name: studybuddy-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: Study_Buddy_Backend/Study_Buddy
    dockerfilePath: Study_Buddy_Backend/Study_Buddy/Dockerfile
    dockerContext: Study_Buddy_Backend/Study_Buddy
    healthCheckPath: /api/learning/exams
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Mistral__ApiKey
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: studybuddy-db
          property: connectionString

databases:
  - name: studybuddy-db
    plan: free
    region: virginia